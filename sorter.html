<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unfriended</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e5e8; --text: #1c1e21; --muted: #65676b;
    --accent: #2f6fde; --accent-bg: #e7effd; --warn: #8a5a00; --warn-bg: #fdf1d8;
    --ok: #1f7a3d; --ok-bg: #e3f4e8; --bad: #b42318; --bad-bg: #fdeceb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18191a; --card: #242526; --line: #3a3b3c; --text: #e4e6eb; --muted: #b0b3b8;
      --accent: #6ea0ff; --accent-bg: #1d2b45; --warn: #f2c46d; --warn-bg: #3d2f12;
      --ok: #6fd18f; --ok-bg: #173323; --bad: #ff8a80; --bad-bg: #3f1d1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  button, select { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:active { transform: scale(0.97); }
  button:focus-visible, select:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  #load { margin: 24px 0; border: 1.5px dashed var(--line); border-radius: 12px; padding: 32px 16px; text-align: center; background: var(--card); }
  #load.small { padding: 12px 16px; text-align: left; display: flex; align-items: center; gap: 12px; }
  #load.small .big { display: none; }
  h1 { display: flex; align-items: center; gap: 10px; }
  #clear { display: none; margin-left: auto; }
  #load.small #clear { display: block; }
  .danger { color: var(--bad); }
  .danger:hover { border-color: var(--bad); }
  .pick { display: inline-block; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; background: var(--bg); }
  .pick input { position: absolute; opacity: 0; width: 1px; }
  #err { color: var(--bad); font-size: 13px; margin: 8px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .tools select { margin-left: auto; }
  .chip[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .row.done { opacity: 0.55; }
  .row.done .name { text-decoration: line-through; }
  .av { position: relative; overflow: hidden; width: 40px; height: 40px; border-radius: 50%; background: var(--bg); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: none; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .btn { font-size: 14px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 8px; white-space: nowrap; }
  .quiet { background: var(--warn-bg); color: var(--warn); }
  .talk { background: var(--ok-bg); color: var(--ok); }
  .dec[aria-pressed="true"][data-d="keep"] { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  .dec[aria-pressed="true"][data-d="remove"] { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
  .tick { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .next { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--accent-bg); color: var(--text); font-size: 14px; }
  .links { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; background: var(--accent-bg); font-size: 14px; }
  .links span { flex: 1; }
  .empty { text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<main>
  <h1><img src="icons/icon.svg" alt="" width="32" height="32">Unfriended</h1>
  <p class="muted">Sort your friends by how long you've been quiet. Everything stays on this computer.</p>

  <div id="load">
    <p class="big" style="margin:0 0 4px;font-weight:600">Pick your unzipped Facebook data folder</p>
    <p class="big muted" style="margin:0 0 16px">Download it as JSON with Friends and Messages ticked, then unzip it.</p>
    <label class="pick">Choose folder<input id="pick" type="file" webkitdirectory></label>
    <span id="status" class="muted"></span>
    <button id="clear" class="danger">Clear all</button>
    <p id="err" role="alert"></p>
  </div>

  <div id="main"></div>
</main>
<script src="parse.js"></script>
<script src="sorter.js"></script>
</body>
</html>
